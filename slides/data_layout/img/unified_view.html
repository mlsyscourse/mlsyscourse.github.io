<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unified View: Thread ↔ Device</title>
<link rel="stylesheet" href="../viz-base.css">
<script src="../viz-base.js"></script>
<style>
  body { display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:48px 24px; }

  .figure { position:relative; display:flex; flex-direction:column; align-items:center; gap:0; }

  /* Row labels */
  .row-label {
    font-size:13px; font-weight:700; color:var(--dim); letter-spacing:.3px;
    text-transform:uppercase; margin-bottom:10px; text-align:center;
  }

  /* Horizontal rows */
  .hrow {
    display:flex; align-items:center; gap:0; justify-content:center;
  }

  /* Boxes */
  .box {
    width:160px; height:50px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; flex-shrink:0; border-width:2px; border-style:solid;
  }
  .box-axis {
    background:#fff; border-color:#8B1514; color:#8B1514;
  }
  .box-mem {
    background:#f1f5f9; border-color:#4D4F53; color:#4D4F53;
  }

  /* Horizontal arrows */
  .harrow {
    width:48px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .harrow svg { overflow:visible; }

  /* Coarser / finer labels */
  .grain-labels {
    display:flex; justify-content:space-between; width:calc(4*160px + 3*48px);
    margin-bottom:4px;
  }
  .grain {
    font-size:12px; color:dimgray; font-style:italic;
  }

  /* Vertical gap between rows */
  .vgap { height:100px; position:relative; width:calc(4*160px + 3*48px); }

  /* Dashed vertical lines — drawn as SVG */
  .dashes-svg {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none;
  }
</style>
</head>
<body class="figure">

<h1>Unified View: Thread &#8596; Device</h1>
<div class="sub">Same layout algebra works at every level</div>

<div class="figure" id="figure">

  <!-- Axis row label -->
  <div class="row-label">Axis (hardware dimension)</div>

  <!-- Coarser / finer -->
  <div class="grain-labels">
    <span class="grain">coarser</span>
    <span class="grain">finer</span>
  </div>

  <!-- Top row: Axis hierarchy -->
  <div class="hrow" id="axis-row">
    <div class="box box-axis" id="ax0">gpuid</div>
    <div class="harrow"><svg width="48" height="20"><defs><marker id="ah-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8B1514"/></marker></defs><line x1="4" y1="10" x2="38" y2="10" stroke="#8B1514" stroke-width="2" marker-end="url(#ah-r)"/></svg></div>
    <div class="box box-axis" id="ax1">bx (block)</div>
    <div class="harrow"><svg width="48" height="20"><line x1="4" y1="10" x2="38" y2="10" stroke="#8B1514" stroke-width="2" marker-end="url(#ah-r)"/></svg></div>
    <div class="box box-axis" id="ax2">warpid</div>
    <div class="harrow"><svg width="48" height="20"><line x1="4" y1="10" x2="38" y2="10" stroke="#8B1514" stroke-width="2" marker-end="url(#ah-r)"/></svg></div>
    <div class="box box-axis" id="ax3">laneid</div>
  </div>

  <!-- Vertical gap with dashed lines -->
  <div class="vgap" id="vgap">
    <svg class="dashes-svg" id="dashes"></svg>
  </div>

  <!-- Memory row label -->
  <div class="row-label">Memory (storage level)</div>

  <!-- Bottom row: Memory hierarchy -->
  <div class="hrow" id="mem-row">
    <div class="box box-mem" id="mem0">Remote Device</div>
    <div class="harrow"><svg width="48" height="20"><defs><marker id="ah-bi-l" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4D4F53"/></marker><marker id="ah-bi-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4D4F53"/></marker></defs><line x1="4" y1="10" x2="44" y2="10" stroke="#4D4F53" stroke-width="2" marker-start="url(#ah-bi-l)" marker-end="url(#ah-bi-r)"/></svg></div>
    <div class="box box-mem" id="mem1">Global Memory</div>
    <div class="harrow"><svg width="48" height="20"><line x1="4" y1="10" x2="44" y2="10" stroke="#4D4F53" stroke-width="2" marker-start="url(#ah-bi-l)" marker-end="url(#ah-bi-r)"/></svg></div>
    <div class="box box-mem" id="mem2">Shared Memory</div>
    <div class="harrow"><svg width="48" height="20"><line x1="4" y1="10" x2="44" y2="10" stroke="#4D4F53" stroke-width="2" marker-start="url(#ah-bi-l)" marker-end="url(#ah-bi-r)"/></svg></div>
    <div class="box box-mem" id="mem3">Registers</div>
  </div>

</div>

<script>
// Draw dashed vertical lines connecting each axis box to its memory box
function drawDashes() {
  const svg = document.getElementById('dashes');
  const vgap = document.getElementById('vgap');
  const vgapRect = vgap.getBoundingClientRect();

  const pairs = [
    ['ax0','mem0'], ['ax1','mem1'], ['ax2','mem2'], ['ax3','mem3']
  ];

  let lines = '';
  for (const [aId, mId] of pairs) {
    const aBox = document.getElementById(aId);
    const mBox = document.getElementById(mId);
    const aRect = aBox.getBoundingClientRect();
    const mRect = mBox.getBoundingClientRect();

    // x center relative to vgap
    const ax = (aRect.left + aRect.width / 2) - vgapRect.left;
    const mx = (mRect.left + mRect.width / 2) - vgapRect.left;

    lines += `<line x1="${ax}" y1="0" x2="${mx}" y2="${vgapRect.height}"
      stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  }
  svg.innerHTML = lines;
}

drawDashes();
window.addEventListener('resize', drawDashes);
</script>

</body>
</html>
